<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">

  <defs>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075b70"/>
      <stop offset="100%" stop-color="#18c4d4"/>
    </linearGradient>
  </defs>

  <!-- Eye -->
  <path d="M100 85 Q200 10 300 85 Q200 160 100 85Z"
        fill="white"
        stroke="url(#blue)"
        stroke-width="8"/>

  <!-- Iris -->
  <circle cx="200" cy="85" r="38"
          fill="#18a6c0"
          stroke="#075b70"
          stroke-width="8"/>

  <!-- Pupil -->
  <circle cx="200" cy="85" r="16"
          fill="#102c35"/>

  <!-- Eye highlight -->
  <circle cx="188" cy="73" r="6"
          fill="white"/>

  <!-- Medical cross -->
  <rect x="292" y="55" width="18" height="60"
        rx="4" fill="#18a6c0"/>
  <rect x="271" y="76" width="60" height="18"
        rx="4" fill="#18a6c0"/>

  <!-- Company name -->
  <text x="400" y="180"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="58"
        font-weight="bold"
        fill="url(#blue)">
    OPTIMATE
  </text>

  <text x="400" y="225"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="40"
        letter-spacing="12"
        fill="#075b70">
    VISION
  </text>

  <!-- Tagline -->
  <text x="400" y="265"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="18"
        fill="#53656c">
    Clear Vision. Better Life.
  </text>

</svg>